<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Share</title>
            <style>
                @import url(style.css);
            </style>
        </head>
        <body>
            <header>
                <section id="logo-account" type="button">
                        <button id="account-avatar">LS</button>
                </section>
                <details class="menu">
                    <summary class="menu-toggle" aria-label="Open menu" title="Menu">
                        <span></span><span></span><span></span>
                    </summary>
                    <nav class="menu-panel" aria-label="Main menu">
                        <a href="upload.html">Upload</a>
                        <a href="download.html">Download</a>
                    </nav>
                </details>
            </header>
            <main>
                <section id="share-container">
                    <section id="share-editor">
                        <form id="shareForm">
                            <div class="share-type-tabs" role="tablist" aria-label="Share type">
                                <button class="share-type active" id="textTypeButton" type="button" role="tab" aria-selected="true" data-type="text">Text</button>
                                <button class="share-type" id="fileTypeButton" type="button" role="tab" aria-selected="false" data-type="file">File</button>
                            </div>

                            <div id="textSharePanel" class="share-panel">
                            <label for="shareText">Text to share:</label><br>
                            <div class="format-toolbar" aria-label="Text formatting">
                                <button type="button" class="format-button" data-command="bold" aria-label="Bold"><b>B</b></button>
                                <button type="button" class="format-button" data-command="italic" aria-label="Italic"><i>I</i></button>
                                <button type="button" class="format-button" data-command="underline" aria-label="Underline"><u>U</u></button>
                                <button type="button" class="format-button marker-button" data-command="backColor" data-value="#ffe58f" aria-label="Highlight" title="Highlight"><span></span></button>
                            </div>
                            <div id="shareText" class="creator-text" contenteditable="true" role="textbox" aria-multiline="true"></div>
                            </div>

                            <div id="fileSharePanel" class="share-panel" hidden>
                            <label for="shareFile">Choose a file:</label><br>
                            <input type="file" id="shareFile" name="shareFile">
                            </div>

                            <label for="openLimit">Number of opens:</label><br>
                            <input type="number" id="openLimit" name="openLimit" min="1" max="100" value="1" required>
                            <button id="share-submit" type="submit" class="search-btn">Share</button>
                        </form>
                    </section>
                </section>
                <section id="result-panel">
                    <p class="shared-status">Choose text or a file to create a share code.</p>
                </section>
            </main>
            <script type="module" src="auth-logo.js"></script>
            <script type="module" src="share-store.js"></script>
            <script type="module" src="upload.js"></script>
        </body>
    </html>
